<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="警報查詢後台" />
  <title>管理員登入 — 設備警報查詢系統</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body {
      background: #0f1923;
      min-height: 100vh;
    }
    .modal-header {
      background: #0a1118;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .modal-header .btn-close { filter: invert(1); opacity: 0.7; }
    .modal-header .btn-close:hover { opacity: 1; }
    .modal-content {
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      background: #192330;
    }
    .modal-body { background: #192330; color: #e2e8f0; }
    .modal-footer { background: #192330; border-top: 1px solid rgba(255,255,255,0.07); }
    .modal-icon {
      width: 56px;
      height: 56px;
      background: rgba(77,219,196,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .modal-icon img { width: 36px; height: 36px; }
    .back-btn {
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 6px 16px;
      display: inline-block;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
    .admin-badge {
      display: inline-block;
      background: rgba(255,154,60,0.15);
      color: #ff9a3c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,154,60,0.3);
      margin-bottom: 4px;
    }
    .text-muted { color: #64748b !important; }
    h6.fw-bold { color: #e2e8f0; }
    .form-label { color: #94a3b8; }
    .form-control {
      background: #0f1923;
      border-color: rgba(255,255,255,0.14);
      color: #e2e8f0;
    }
    .form-control:focus {
      background: #0f1923;
      border-color: #4ddbc4;
      color: #e2e8f0;
      box-shadow: 0 0 0 3px rgba(77,219,196,0.2);
    }
    .form-control::placeholder { color: #64748b; }
    .form-control:disabled { opacity: 0.5; }
    .btn-dark { background: #4ddbc4; border-color: #4ddbc4; color: #0a1118; font-weight: 600; }
    .btn-dark:hover { background: #3cc9b0; border-color: #3cc9b0; color: #0a1118; }
    .btn-dark:disabled { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.1); color: #64748b; }
    .small.text-muted { color: #64748b !important; }

    .dept-select-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px; /* 約 4 張卡片＋分隔線＋系統管理員選項，超過才捲動 */
      overflow-y: auto;
    }
    .dept-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 46px;
      padding: 8px 14px;
      cursor: pointer;
      text-align: left;
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      background: #0f1923;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.15s, background 0.15s;
    }
    .dept-option:hover { border-color: rgba(77,219,196,0.4); }
    .dept-option.selected { border-color: #4ddbc4; background: rgba(77,219,196,0.08); }
    .dept-option .code {
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
      color: #64748b;
    }
    .dept-option.system-option {
      border-style: dashed;
    }
    .dept-option.system-option .name-group { display: flex; flex-direction: column; }
    .dept-option.system-option .hint { font-size: 11px; color: #94a3b8; }
    .dept-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 2px;
    }
    .dept-divider::before, .dept-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .dept-divider span {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      white-space: nowrap;
    }
    .notice-msg {
      background: rgba(251,191,36,0.1);
      color: #fbbf24;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
      border: 1px solid rgba(251,191,36,0.25);
      line-height: 1.6;
    }
    .notice-msg .count { font-variant-numeric: tabular-nums; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Modal -->
  <div class="modal fade" id="adminLoginModal" tabindex="-1"
       data-bs-backdrop="static" data-bs-keyboard="false"
       aria-labelledby="adminLoginLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title w-100 text-center" id="adminLoginLabel">
            警報代碼 · 後台管理
          </h5>
        </div>

        <div class="modal-body px-4 py-4">
          <div class="text-center mb-3">
            <div class="modal-icon">
              <img src="/icon.svg" alt="" />
            </div>
            <span class="admin-badge">ADMIN</span>
            <h6 class="mb-1 fw-bold mt-1">後台管理員登入</h6>
            <p class="text-muted small mb-0">此區域僅限管理員使用</p>
          </div>

          <div id="errMsg" class="alert alert-danger py-2 text-center small" hidden>
            密碼錯誤，請確認選擇的部門與密碼是否正確
          </div>

          <div id="throttleHint" class="notice-msg" style="display:none">
            若剛才輸入太多次密碼，系統會暫時暫停登入約 1 分鐘，請稍候再送出一次。
          </div>

          <form method="post" action="/admin/login" id="adminLoginForm">
            <input type="hidden" name="department" id="deptField" value="" />

            <div class="mb-3">
              <label class="form-label fw-semibold">部門</label>
              <div class="dept-select-wrap" id="deptList">
                <div class="text-muted small">載入部門清單中…</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="pw" class="form-label fw-semibold">管理員密碼</label>
              <input
                type="password"
                id="pw"
                name="password"
                class="form-control form-control-lg"
                autocomplete="current-password"
                placeholder="輸入管理員密碼"
                required
              />
            </div>
            <div class="d-grid mb-2">
              <button type="submit" id="submitBtn" class="btn btn-dark btn-lg">進入後台</button>
            </div>
          </form>
        </div>

        <div class="modal-footer justify-content-between border-top pt-2 pb-3">
          <a href="/app" class="back-btn">← 返回查詢介面</a>
          <span class="text-muted small">內部使用系統</span>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const p = new URLSearchParams(window.location.search);
    if (p.get('error')) document.getElementById('errMsg').hidden = false;

    const modalEl = document.getElementById('adminLoginModal');
    const modal = new bootstrap.Modal(modalEl);
    modalEl.addEventListener('shown.bs.modal', () => {
      document.getElementById('pw').focus();
    });
    modal.show();

    // ── 部門清單載入：真實部門 + 系統管理員（__super__）分岔選項 ──────
    const deptField = document.getElementById('deptField');
    const deptList = document.getElementById('deptList');

    function selectDept(code, el) {
      deptField.value = code;
      deptList.querySelectorAll('.dept-option').forEach(n => n.classList.remove('selected'));
      el.classList.add('selected');
    }

    // 事件委派：綁在容器上、不逐一綁在動態按鈕上（PLAN 第三十七輪修正：
    // 早期以為是動畫時序問題，實際原因不明——委派本身能繞開「listener
    // 綁在會被重繪／延後插入的節點上」這整類問題，不論真正成因是哪一種）。
    deptList.addEventListener('click', (e) => {
      const btn = e.target.closest('.dept-option');
      if (!btn) return;
      selectDept(btn.dataset.deptCode, btn);
    });

    // 記住上次選擇的部門並置頂，同 login.html（見該檔案說明）。
    // __super__ 是固定的特例選項（跨部門、獨立樣式與分隔線），不參與排序。
    const LAST_DEPT_KEY = 'alarmSystem.lastDept';

    fetch('/api/departments/public').then(r => r.ok ? r.json() : []).then(depts => {
      deptList.innerHTML = '';
      const lastId = localStorage.getItem(LAST_DEPT_KEY);
      if (lastId) {
        const idx = depts.findIndex(d => d.id === lastId);
        if (idx > 0) depts.unshift(depts.splice(idx, 1)[0]);
      }
      depts.forEach((d, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dept-option';
        btn.dataset.deptCode = d.id;
        const nameSpan = document.createElement('span');
        nameSpan.textContent = d.name;
        const codeSpan = document.createElement('span');
        codeSpan.className = 'code';
        codeSpan.textContent = d.id;
        btn.appendChild(nameSpan);
        btn.appendChild(codeSpan);
        deptList.appendChild(btn);
        if (i === 0) selectDept(d.id, btn);
      });

      const divider = document.createElement('div');
      divider.className = 'dept-divider';
      divider.innerHTML = '<span>不同的驗證路徑</span>';
      deptList.appendChild(divider);

      const sysBtn = document.createElement('button');
      sysBtn.type = 'button';
      sysBtn.className = 'dept-option system-option';
      sysBtn.dataset.deptCode = '__super__';
      sysBtn.innerHTML = `
        <span class="name-group">
          <span>系統管理員</span>
          <span class="hint">跨部門，不屬於任何部門</span>
        </span>
        <span class="code">SYSTEM</span>`;
      deptList.appendChild(sysBtn);

      if (!depts.length) selectDept('__super__', sysBtn);
    }).catch(() => {
      deptList.innerHTML = '<div class="text-muted small">部門清單載入失敗，請重新整理頁面</div>';
    });

    // 送出前記住這次選的部門（僅真實部門，__super__ 不記錄——它本來就
    // 固定顯示在清單最後，不需要也不該被排到前面）。
    //
    // 送出中的按鈕狀態（同 login.html：UI/UX 檢查發現正常送出路徑
    // 完全沒有 loading 回饋）。不 preventDefault()，只是在導航發生前
    // 把按鈕 disable+換文字。
    document.getElementById('adminLoginForm').addEventListener('submit', () => {
      const code = deptField.value;
      if (code && code !== '__super__') localStorage.setItem(LAST_DEPT_KEY, code);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '登入中…';
    });

    // ── 429 節流倒數（同 login.html 的漸進增強邏輯）──────────────────
    const throttled = parseInt(p.get('throttled') || '0', 10);
    if (throttled > 0) {
      const hint = document.getElementById('throttleHint');
      const pw = document.getElementById('pw');
      const btn = document.getElementById('submitBtn');
      hint.style.display = 'block';
      pw.disabled = true;
      btn.disabled = true;
      let remain = throttled;
      const render = () => {
        hint.innerHTML = `密碼錯誤次數過多，已暫停登入。剩餘 <span class="count">${remain}</span> 秒後可再試一次。`;
      };
      render();
      const timer = setInterval(() => {
        remain -= 1;
        if (remain <= 0) {
          clearInterval(timer);
          hint.style.display = 'none';
          pw.disabled = false;
          btn.disabled = false;
        } else {
          render();
        }
      }, 1000);

      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('throttled');
      window.history.replaceState({}, '', cleanUrl);
    }

    // PWA 安裝入口補齊：這支頁面（/admin/login）原本沒有 manifest 引用
    // 也沒有註冊 service worker，若使用者只走管理員登入路徑、從未經過
    // /app 或 /admin，就完全沒有機會觸發「加入主畫面」提示——manifest
    // 的 scope 是 "/"，只要曾在任一頁面註冊過就整站生效，這裡補上是
    // 讓「只用後台」的裝置也有安裝入口，不依賴使用者剛好先去過前台。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
