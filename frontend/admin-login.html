<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="警報查詢後台" />
  <title>管理員登入 — 設備警報查詢系統</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body {
      background: #0f1923;
      min-height: 100vh;
    }
    .modal-header {
      background: #0a1118;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .modal-header .btn-close { filter: invert(1); opacity: 0.7; }
    .modal-header .btn-close:hover { opacity: 1; }
    .modal-content {
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      background: #192330;
    }
    .modal-body { background: #192330; color: #e2e8f0; }
    .modal-footer { background: #192330; border-top: 1px solid rgba(255,255,255,0.07); }
    .modal-icon {
      width: 56px;
      height: 56px;
      background: rgba(77,219,196,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .modal-icon img { width: 36px; height: 36px; }
    .back-btn {
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 6px 16px;
      display: inline-block;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
    .admin-badge {
      display: inline-block;
      background: rgba(255,154,60,0.15);
      color: #ff9a3c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,154,60,0.3);
      margin-bottom: 4px;
    }
    .text-muted { color: #64748b !important; }
    h6.fw-bold { color: #e2e8f0; }
    .form-label { color: #94a3b8; }
    .form-control {
      background: #0f1923;
      border-color: rgba(255,255,255,0.14);
      color: #e2e8f0;
    }
    .form-control:focus {
      background: #0f1923;
      border-color: #4ddbc4;
      color: #e2e8f0;
      box-shadow: 0 0 0 3px rgba(77,219,196,0.2);
    }
    .form-control::placeholder { color: #64748b; }
    .form-control:disabled { opacity: 0.5; }
    .btn-dark { background: #4ddbc4; border-color: #4ddbc4; color: #0a1118; font-weight: 600; }
    .btn-dark:hover { background: #3cc9b0; border-color: #3cc9b0; color: #0a1118; }
    .btn-dark:disabled { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.1); color: #64748b; }
    .small.text-muted { color: #64748b !important; }

    .dept-select-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* login isolation v3：靜態顯示目前登入對象／fallback 提示，不可點選
       （原本可點選的 .dept-option 部門清單樣式已隨清單移除，不再需要）*/
    .dept-fixed {
      display: flex;
      align-items: center;
      min-height: 46px;
      padding: 8px 14px;
      cursor: default;
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      background: #0f1923;
      color: #e2e8f0;
      font-size: 14px;
    }
    .notice-msg {
      background: rgba(251,191,36,0.1);
      color: #fbbf24;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
      border: 1px solid rgba(251,191,36,0.25);
      line-height: 1.6;
    }
    .notice-msg .count { font-variant-numeric: tabular-nums; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Modal -->
  <div class="modal fade" id="adminLoginModal" tabindex="-1"
       data-bs-backdrop="static" data-bs-keyboard="false"
       aria-labelledby="adminLoginLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title w-100 text-center" id="adminLoginLabel">
            警報代碼 · 後台管理
          </h5>
        </div>

        <div class="modal-body px-4 py-4">
          <div class="text-center mb-3">
            <div class="modal-icon">
              <img src="/icon.svg" alt="" />
            </div>
            <span class="admin-badge">ADMIN</span>
            <h6 class="mb-1 fw-bold mt-1">後台管理員登入</h6>
            <p class="text-muted small mb-0">此區域僅限管理員使用</p>
          </div>

          <div id="errMsg" class="alert alert-danger py-2 text-center small" hidden>
            密碼錯誤，請確認選擇的部門與密碼是否正確
          </div>

          <div id="throttleHint" class="notice-msg" style="display:none">
            若剛才輸入太多次密碼，系統會暫時暫停登入約 1 分鐘，請稍候再送出一次。
          </div>

          <form method="post" action="/admin/login" id="adminLoginForm">
            <input type="hidden" name="department" id="deptField" value="" />

            <div class="mb-3">
              <label class="form-label fw-semibold">部門</label>
              <div class="dept-select-wrap" id="deptList"></div>
            </div>

            <div class="mb-3">
              <label for="pw" class="form-label fw-semibold">管理員密碼</label>
              <input
                type="password"
                id="pw"
                name="password"
                class="form-control form-control-lg"
                autocomplete="current-password"
                placeholder="輸入管理員密碼"
                required
              />
            </div>
            <div class="d-grid mb-2">
              <button type="submit" id="submitBtn" class="btn btn-dark btn-lg">進入後台</button>
            </div>
          </form>
        </div>

        <div class="modal-footer justify-content-between border-top pt-2 pb-3">
          <a href="/app" class="back-btn">← 返回查詢介面</a>
          <span class="text-muted small">內部使用系統</span>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const p = new URLSearchParams(window.location.search);
    if (p.get('error')) document.getElementById('errMsg').hidden = false;

    const modalEl = document.getElementById('adminLoginModal');
    const modal = new bootstrap.Modal(modalEl);
    modalEl.addEventListener('shown.bs.modal', () => {
      document.getElementById('pw').focus();
    });
    modal.show();

    // ── 後台登入入口隔離（login isolation v3）：不再列出部門清單或
    // 系統管理員選項，dept_id 從 URL 路徑帶入，使用者沒有「切換部門」
    // 的互動——這正是這次改動要達成的效果。─────────────────────────
    const deptField = document.getElementById('deptField');
    const deptList = document.getElementById('deptList');

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    // /admin/login/mf4c -> ["admin", "login", "mf4c"]，取第三段
    const urlDeptId = pathParts.length >= 3 ? pathParts[2] : null;

    if (urlDeptId === '__super__') {
      deptField.value = '__super__';
      deptList.innerHTML = `<div class="dept-fixed">系統管理員登入</div>`;
    } else if (urlDeptId) {
      deptField.value = urlDeptId;
      deptList.innerHTML = `<div class="dept-fixed">${urlDeptId} 部門登入</div>`;
    } else {
      // 不帶部門造訪，且沒有登入狀態——外部審查 2026-09-22 建議：導去前台
      // /login 這個系統唯一的正常入口，比原本的純文字死路提示（使用者
      // 沒書籤/不知道網址時完全卡住）更合理。已登入前台的一般使用者點
      // 「後台管理」時，admin_required 裝飾器會用 session["department"]
      // 自動帶對的 dept_id 導來這裡（見 app.py admin_required），不會經過
      // 這個分支——這裡處理的是「完全沒有任何登入狀態」的情況，導去
      // /login 讓使用者從頭正常登入，取代原本 localStorage 記憶部門的
      // 自動重導（該機制已移除，見同一輪修復：對未登入訪客洩漏裝置曾
      // 登入過的真實部門 id）。
      window.location.replace('/login');
    }

    // 送出中的按鈕狀態（同 login.html：UI/UX 檢查發現正常送出路徑
    // 完全沒有 loading 回饋）。不 preventDefault()，只是在導航發生前
    // 把按鈕 disable+換文字。
    document.getElementById('adminLoginForm').addEventListener('submit', () => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '登入中…';
    });

    // ── 429 節流倒數（同 login.html 的漸進增強邏輯）──────────────────
    const throttled = parseInt(p.get('throttled') || '0', 10);
    if (throttled > 0) {
      const hint = document.getElementById('throttleHint');
      const pw = document.getElementById('pw');
      const btn = document.getElementById('submitBtn');
      hint.style.display = 'block';
      pw.disabled = true;
      btn.disabled = true;
      let remain = throttled;
      const render = () => {
        hint.innerHTML = `密碼錯誤次數過多，已暫停登入。剩餘 <span class="count">${remain}</span> 秒後可再試一次。`;
      };
      render();
      const timer = setInterval(() => {
        remain -= 1;
        if (remain <= 0) {
          clearInterval(timer);
          hint.style.display = 'none';
          pw.disabled = false;
          btn.disabled = false;
        } else {
          render();
        }
      }, 1000);

      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('throttled');
      window.history.replaceState({}, '', cleanUrl);
    }

    // PWA 安裝入口補齊：這支頁面（/admin/login）原本沒有 manifest 引用
    // 也沒有註冊 service worker，若使用者只走管理員登入路徑、從未經過
    // /app 或 /admin，就完全沒有機會觸發「加入主畫面」提示——manifest
    // 的 scope 是 "/"，只要曾在任一頁面註冊過就整站生效，這裡補上是
    // 讓「只用後台」的裝置也有安裝入口，不依賴使用者剛好先去過前台。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
